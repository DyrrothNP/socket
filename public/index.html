<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Socket.IO Messenger</title><script src="/socket.io/socket.io.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0b1020;color:#eef2ff}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{max-width:1050px;margin:auto;padding:20px}.card{background:#141a2e;border:1px solid #29304a;border-radius:16px;padding:18px}.auth{max-width:420px;margin:8vh auto}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button,.btn{border:0;border-radius:10px;padding:10px 14px;background:#27304b;color:white}.tabs .active,.primary{background:#5865f2}.field{width:100%;padding:12px;margin:7px 0;background:#0e1425;border:1px solid #303956;color:white;border-radius:10px}.layout{display:grid;grid-template-columns:300px 1fr;gap:15px;height:calc(100vh - 40px)}.sidebar,.chat{min-height:0}.scroll{overflow:auto}.user{padding:11px;border-radius:10px;margin:5px 0;background:#0e1425;display:flex;align-items:center;justify-content:space-between;gap:8px}.user.active{outline:1px solid #5865f2}.messages{height:calc(100% - 110px);overflow:auto;padding:15px}.msg{max-width:70%;padding:10px 13px;border-radius:14px;margin:7px 0;background:#252d46}.mine{margin-left:auto;background:#5865f2}.composer{display:flex;gap:8px;padding:10px}.small{color:#9aa4c2;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center}.pill{padding:3px 7px;border-radius:20px;background:#26304b;font-size:12px}.request{display:flex;gap:7px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #29304a}@media(max-width:700px){.layout{grid-template-columns:1fr;height:auto}.sidebar{max-height:45vh}.chat{height:55vh}}
</style></head><body><div id="root"></div><script>
const $=s=>document.querySelector(s), api=async(url,opt={})=>{const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(localStorage.token||'')}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d};
let me=null,socket=null,current=null,typingTimer=null,online=new Set();
function authView(mode='login'){root.innerHTML=`<div class="auth card"><h1>💬 Messenger</h1><p class="small">A Socket.IO learning project</p><div class="tabs"><button class="${mode==='login'?'active':''}" onclick="authView('login')">Login</button><button class="${mode==='register'?'active':''}" onclick="authView('register')">Register</button></div><input id="username" class="field" placeholder="username"><input id="password" class="field" type="password" placeholder="password"><button class="btn primary" onclick="submitAuth('${mode}')">${mode==='login'?'Login':'Create account'}</button><p id="err" class="small"></p></div>`}
async function submitAuth(mode){try{const d=await api('/api/'+mode,{method:'POST',body:JSON.stringify({username:$('#username').value,password:$('#password').value})});localStorage.token=d.token;me=d.user;start()}catch(e){$('#err').textContent=e.message}}
async function start(){try{me=(await api('/api/me')).user;render();connect();loadAll()}catch{localStorage.removeItem('token');authView()}}
function render(){root.innerHTML=`<div class="app"><div class="top"><div><h2>💬 Messenger</h2><span class="small">Logged in as <b>${esc(me.username)}</b></span></div><button class="btn" onclick="logout()">Logout</button></div><div class="layout"><div class="sidebar card scroll"><h3>Friends</h3><input id="search" class="field" placeholder="Search users" oninput="searchUsers()"><div id="users"></div><h3>Requests</h3><div id="requests"></div></div><div class="chat card"><div id="chatHead" class="top" style="padding:10px 15px"><b>Select a friend</b></div><div id="messages" class="messages"></div><div id="typing" class="small" style="padding:0 15px;height:20px"></div><div class="composer"><input id="message" class="field" placeholder="Message..." onkeydown="keySend(event)" oninput="typing()"><button class="btn primary" onclick="send()">Send</button></div></div></div></div>`}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadAll(){await loadFriends();await loadRequests();}
async function loadFriends(){const d=await api('/api/friends');renderUsers(d.friends)}
function renderUsers(users){users.forEach(u=>u.online=online.has(u.id));$('#users').innerHTML=users.map(u=>`<div class="user ${current?.id===u.id?'active':''}" onclick='openChat(${JSON.stringify(u)})'><span>👤 ${esc(u.username)} <span class="small">${online.has(u.id)?'🟢':'⚫'}</span></span></div>`).join('')||'<p class="small">No friends yet.</p>'}
async function searchUsers(){const q=$('#search').value.trim();if(!q){loadFriends();return}const d=await api('/api/users?q='+encodeURIComponent(q));$('#users').innerHTML=d.users.map(u=>`<div class="user"><span>👤 ${esc(u.username)}</span><button class="btn" onclick="addFriend('${u.id}')">Add</button></div>`).join('')||'<p class="small">No users found.</p>'}
async function addFriend(id){try{alert((await api('/api/friends/request',{method:'POST',body:JSON.stringify({userId:id})})).message);searchUsers()}catch(e){alert(e.message)}}
async function loadRequests(){const d=await api('/api/requests');$('#requests').innerHTML=d.incoming.map(r=>`<div class="request"><span>👤 ${esc(r.fromUser.username)}</span><span><button class="btn primary" onclick="respond('${r.id}',true)">Accept</button> <button class="btn" onclick="respond('${r.id}',false)">Reject</button></span></div>`).join('')||'<p class="small">No incoming requests.</p>'}
async function respond(id,accept){try{await api('/api/friends/respond',{method:'POST',body:JSON.stringify({requestId:id,accept})});loadAll()}catch(e){alert(e.message)}}
async function openChat(u){current=u;$('#chatHead').innerHTML=`<b>💬 ${esc(u.username)}</b><span class="pill">${online.has(u.id)?'online':'offline'}</span>`;$('#messages').innerHTML='';document.querySelectorAll('.user').forEach(x=>x.classList.remove('active'));const d=await api('/api/messages/'+u.id);d.messages.forEach(addMessage);scroll();}
function addMessage(m){const el=document.createElement('div');el.className='msg '+(m.from===me.id?'mine':'');el.innerHTML=`${esc(m.text)}<div class="small">${new Date(m.createdAt).toLocaleTimeString()}</div>`;$('#messages').appendChild(el)}
function scroll(){$('#messages').scrollTop=$('#messages').scrollHeight}
function connect(){socket=io({auth:{token:localStorage.token}});socket.on('connect_error',()=>{localStorage.removeItem('token');location.reload()});socket.on('online-users',d=>{online=new Set(d.userIds);loadFriends()});socket.on('presence',d=>{d.online?online.add(d.userId):online.delete(d.userId);loadFriends();if(current&&current.id===d.userId)openChat(current)});socket.on('new-message',d=>{if(current&&d.message.from===current.id)addMessage(d.message),scroll();else alert('New message received')});socket.on('friend-request',()=>loadRequests());socket.on('friend-accepted',()=>loadFriends());socket.on('typing',d=>{if(current&&d.userId===current.id){$('#typing').textContent=d.typing?current.username+' is typing...':''}})}
function typing(){if(!socket||!current)return;socket.emit('typing',{to:current.id,typing:true});clearTimeout(typingTimer);typingTimer=setTimeout(()=>socket.emit('typing',{to:current.id,typing:false}),700)}
function keySend(e){if(e.key==='Enter'){e.preventDefault();send()}}
function send(){if(!current)return;const text=$('#message').value.trim();if(!text)return;socket.emit('send-message',{to:current.id,text},r=>{if(!r?.ok)return alert(r?.error||'Send failed');addMessage(r.message);$('#message').value='';scroll()})}
function logout(){localStorage.removeItem('token');if(socket)socket.disconnect();location.reload()}
if(localStorage.token)start();else authView();
</script></body></html>
